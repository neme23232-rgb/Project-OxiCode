[package]
name = "oxicode-ds"
version = "0.1.0"
edition = "2024"
description = "oxicode Desktop - Cline-style UI powered by oxicode-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
oxicode-core = { path = "../../oxicode-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
