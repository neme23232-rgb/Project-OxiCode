[package]
name = "oxicode-core"
version = "0.1.0"
edition = "2024"
description = "Shared core engine for oxicode CLI and Desktop"

[dependencies]
anyhow = "1"
dirs = "5"
futures-util = "0.3"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
toml = "0.8"
