[package]
name = "oxicode"
version = "0.1.0"
edition = "2024"
description = "Fast, low-memory terminal AI coding agent in Rust"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
oxicode-core = { path = "../oxicode-core" }
ratatui = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "fs", "sync", "time"] }
